name: ecomind
description: "EcoMind 2.0 - On-device AI waste-sorting assistant with digital image processing."
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  image_picker: ^1.1.2
  image: ^4.3.0
  tflite_flutter: ^0.11.0
  firebase_core: ^3.10.1
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.5
  share_plus: ^10.1.3
  archive: ^4.0.2
  flutter_markdown: ^0.7.5
  http: ^1.3.0
  intl: ^0.20.2
  animate_do: ^3.3.7
  flutter_spinkit: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_icons:
  image_path: "icons/icon.jpeg"
  android: true
  ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/models/
    - assets/rules/
